act_code: '129842'
requisite: Решение маслихата города Астаны от 6 марта 2019 года № 362/45-VI. Зарегистрировано Департаментом юстиции города Астаны 27 марта 2019 года № 1212. Утратило силу решением маслихата города Нур-Султана от 30 июня 2020 года № 516/68-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан города Астаны к 30-летию вывода войск бывшего Союза Советских Социалистических Республик с территории Афганистана
  kaz: Астана қаласы мұқтаж азаматтарының жекелеген санаттарына бұрынғы Кеңестік Социалистік Республикалар Одағының Ауғанстан аумағынан әскерді шығаруының 30 жылдығына орай қосымша әлеуметтік көмек көрсету туралы
