    kaz: «Астана қаласының тарихи және мәдени ескерткіштерін қорғау аймақтарының, құрылыс салуды реттеу аймақтарының шекараларын бекіту туралы» Астана қаласы мәслихатының 2010 жылғы 26 қарашадағы № 404/53-IV шешіміне өзгеріс енгізу туралы
