requisite: Решение маслихата города Астаны от 12 декабря 2018 года № 341/42-VI. Зарегистрировано Департаментом юстиции города Астаны 22 февраля 2019 года № 1204. Утратило силу решением маслихата города Нур-Султана от 27 июня 2019 года № 396/52-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении лекарственных средств, специализированных лечебных продуктов, медицинских изделий отдельным категориям граждан при амбулаторном лечении бесплатно и на льготных условиях
  kaz: Азаматтардың жекелеген санаттарына амбулаториялық емдеу кезінде тегін және жеңілдікті шарттармен дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды косымша беру туралы
