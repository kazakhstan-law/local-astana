  title:
    rus: О внесении изменений и дополнения в решение маслихата города Астаны от 17 марта 2017 № 115/17-VI «О порядке и размерах возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов города Нур-Султан»
    kaz: Астана қаласы мәслихатының 2017 жылғы 17 наурыздағы № 115/17-VI «Нұр-Сұлтан қаласының мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшері туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
