  title:
    rus: О внесении изменений в решение маслихата города Астаны от 17 марта 2017 № 115/17-VI «О порядке и размерах возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов города Астаны»
    kaz: «Астана қаласының мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшері туралы» Астана қаласы мәслихатының 2017 жылғы 17 наурыздағы № 115/17-VI шешіміне өзгеріс енгізу туралы
