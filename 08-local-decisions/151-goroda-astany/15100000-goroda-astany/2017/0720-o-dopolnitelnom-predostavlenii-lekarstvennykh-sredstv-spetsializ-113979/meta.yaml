requisite: Решение маслихата города Астаны от 20 июля 2017 года № 170/21-VI. Зарегистрировано Департаментом юстиции города Астаны 9 августа 2017 года № 1123. Утратило силу решением маслихата города Астаны от 12 декабря 2018 года № 341/42-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении лекарственных средств, специализированных лечебных продуктов, изделий медицинского назначения отдельным категориям граждан при амбулаторном лечении бесплатно и на льготных условиях
  kaz: Азаматтардың жекелеген санаттарына амбулаториялық емделу кезінде тегін және жеңілдікті шарттармен дәрілік заттарды, бейімделген емдік өнімдерді, медициналық мақсаттағы бұйымдарды қосымша беру туралы
