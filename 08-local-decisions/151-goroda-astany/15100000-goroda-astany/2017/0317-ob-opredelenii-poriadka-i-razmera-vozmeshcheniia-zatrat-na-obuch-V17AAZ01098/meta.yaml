  title:
    rus: О внесении изменения в решение маслихата города Астаны от 17 марта 2017 года № 115/17-VI «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью города Астаны»
    kaz: «Астана қаласының мүгедектігі бар балалар қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға жұмсалған шығындарды өндіріп алу тәртібі мен мөлшері туралы» Астана қаласы мәслихатының 2017 жылғы 17 наурыздағы № 115/17-VI шешіміне өзгеріс енгізу туралы
