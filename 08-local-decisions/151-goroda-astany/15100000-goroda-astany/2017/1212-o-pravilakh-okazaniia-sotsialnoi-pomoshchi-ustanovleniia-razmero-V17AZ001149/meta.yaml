  requisite: Решение маслихата города Нур-Султана от 25 мая 2022 года № 178/25-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 июня 2022 года № 28313. Утратило силу решением маслихата города Астаны от 3 октября 2023 года № 84/10-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в решение маслихата города Астаны от 12 декабря 2017 года № 221/25-VI «О Правилах оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Нур-Султан»
    kaz: «Нұр-Сұлтан қаласының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасы туралы» Астана қаласы мәслихатының 2017 жылғы 12 желтоқсандағы № 221/25-VI шешіміне өзгерістер мен толықтыру енгізу туралы
