  title:
    rus: О внесении изменений в решение маслихата города Астаны от 12 декабря 2017 года № 221/25-VI «О Правилах оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Нур-Султан»
    kaz: «Нұр-Сұлтан қаласының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасы туралы» Астана қаласы мәслихатының 2017 жылғы 12 желтоқсандағы № 221/25-VI шешіміне өзгерістер енгізу туралы
