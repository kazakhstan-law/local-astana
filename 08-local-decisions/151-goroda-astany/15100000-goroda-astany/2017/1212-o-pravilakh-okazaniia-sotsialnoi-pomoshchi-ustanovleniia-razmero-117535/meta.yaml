    kaz: «Астана қаласында әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасы туралы» Астана қаласы мәслихатының 2017 жылғы 12 желтоқсандағы № 221/25-VI шешіміне өзгерістер мен толықтырулар енгізу туралы
