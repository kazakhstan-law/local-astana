  title:
    rus: О внесении изменений в решение маслихата города Астаны от 20 июля 2017 года № 167/21-VI «О Порядке оказания социальной помощи отдельным категориям граждан города Нур-Султан в виде освобождения от оплаты за проезд на маршрутах городского пассажирского транспорта»
    kaz: «Нұр-Сұлтан қаласы азаматтарының жекелеген санаттарына қалалық бағдарлардың жолаушылар көлігінде жол жүруге төлем төлеуден босату түрінде әлеуметтік көмек көрсету тәртібі туралы» Астана қаласы мәслихатының 2017 жылғы 20 шілдедегі № 167/21-VI шешіміне өзгерістер енгізу туралы
