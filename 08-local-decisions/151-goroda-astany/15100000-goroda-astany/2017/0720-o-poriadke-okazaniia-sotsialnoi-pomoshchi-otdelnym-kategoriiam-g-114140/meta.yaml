    kaz: «Астана қаласы азаматтарының жекелеген санаттарына қалалық бағдарлардың жолаушылар көлігінде жол жүруге төлем төлеуден босату түрінде әлеуметтік көмек көрсету тәртібі туралы» Астана қаласы мәслихатының 2017 жылғы 20 шілдедегі № 167/21-VI шешіміне өзгерістер енгізу туралы
