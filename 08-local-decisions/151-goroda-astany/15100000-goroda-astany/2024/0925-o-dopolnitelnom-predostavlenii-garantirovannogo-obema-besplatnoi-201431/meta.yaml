requisite: Решение маслихата города Астаны от 25 сентября 2024 года № 221/27-VIII. Отменено решением маслихата города Астаны от 26 декабря 2025 года № 373/48-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированным в городе Астане при амбулаторном лечении бесплатно
  kaz: Астана қаласында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы
