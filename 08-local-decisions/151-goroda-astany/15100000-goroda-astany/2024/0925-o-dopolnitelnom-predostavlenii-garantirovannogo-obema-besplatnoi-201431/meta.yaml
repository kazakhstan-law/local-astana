  title:
    rus: О внесении изменения и дополнений в решение маслихата города Астаны от 25 сентября 2024 года № 221/27-VIII «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированным в городе Астане, при амбулаторном лечении бесплатно»
    kaz: «Астана қаласында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» Астана қаласы мәслихатының 2024 жылғы 25 қыркүйектегі №221/27-VIII шешіміне өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/210688/rus
