act_code: '191355'
requisite: Решение маслихата города Астаны от 26 декабря 2023 года № 133/16-VIII. Зарегистрировано Департаментом юстиции города Астаны 29 декабря 2023 года № 1368-01
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, на  которых запрещено проведение пикетирования в городе Астане
  kaz: Астана қаласы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
