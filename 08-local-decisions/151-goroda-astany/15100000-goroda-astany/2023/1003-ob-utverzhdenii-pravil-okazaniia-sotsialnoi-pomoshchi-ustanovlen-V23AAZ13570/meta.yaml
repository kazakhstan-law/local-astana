  title:
    rus: О внесении изменений и дополнения в решение маслихата города Астаны от 3 октября 2023 года № 84/10-VIII «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Астаны»
    kaz: «Астана қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» Астана қаласы мәслихатының 2023 жылғы 3 қазандағы № 84/10-VIII шешіміне өзгерістер мен толықтыру енгізу туралы
