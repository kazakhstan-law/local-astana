requisite: Решение Акима города Астаны от 20 февраля 2002 года N 3-1-5. Зарегистрировано управлением юстиции города Астаны от 6 марта 2002 года N 175. Утратило силу постановлением акимата города Астаны от 9 декабря 2009 года N 06-22
title:
