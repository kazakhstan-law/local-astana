  kaz: Тотализаторлар мен казиноларды ұйымдастыру және өткiзу жөнiндегi қызметтердi жүзеге асыратын субъектілердің тұрақты қаржылық жағдайын анықтау үшін қажетті құжаттар мен көрсеткіштер тізбелерін бекіту туралы
