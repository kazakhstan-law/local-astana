caused_by:
  code: '227188'
  requisite: Решение маслихата города Астаны от 26 июня 2026 года № 436/56-VIII
  title:
    rus: О внесении изменений и дополнений в решение маслихата города Астаны от 26 декабря 2025 года № 373/48-VIII «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированным в городе Астане, при амбулаторном лечении бесплатно»
    kaz: «Астана қаласында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» Астана қаласы мәслихатының 2025 жылғы 26 желтоқсандағы № 373/48-VIII шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227188/rus
