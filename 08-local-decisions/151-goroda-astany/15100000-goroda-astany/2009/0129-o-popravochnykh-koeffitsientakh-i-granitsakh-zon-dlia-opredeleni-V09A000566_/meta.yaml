  title:
    rus: О внесении изменения в решение маслихата города Астаны от 29 января 2009 года № 185/30-IV «О поправочных коэффициентах и границах зон для определения кадастровой (оценочной) стоимости земельных участков при их предоставлении в частную собственность, сдаче государством или государственными землепользователями в аренду»
    kaz: Астана қаласы мәслихатының 2009 жылғы 29 қаңтардағы № 185/30-IV «Жер учаскелері жеке меншікке берілген, мемлекет немесе мемлекеттік жер пайдаланушылар жалға берген кезде олардың кадастрлық (бағалау) құнын белгілеу үшін түзету коэффициенттері мен аймақ шекараларын бекіту туралы» шешіміне өзгеріс енгізу туралы
