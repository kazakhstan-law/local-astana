title:
  rus: О поправочных коэффициентах и границах зон для определения кадастровой (оценочной) стоимости земельных участков при их предоставлении в частную собственность, сдаче государством или государственными землепользователями в аренду
  kaz: Жер учаскелері жеке меншікке берілген, мемлекет немесе мемлекеттік жер пайдаланушылар жалға берген кезде олардың кадастрлық (бағалау) құнын белгілеу үшін түзету коэффициенттері мен аймақ шекараларын бекіту туралы
