requisite: Решение маслихата города Нур-Султана от 2 июня 2020 года № 500/66-VI. Зарегистрировано Департаментом юстиции города Нур-Султана 15 июня 2020 года № 1271. Утратило силу решением маслихата города Нур-Султана от 16 июля 2021 года № 66/9-VI (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении лекарственных средств, специализированных лечебных продуктов, медицинских изделий отдельным категориям граждан при амбулаторном лечении бесплатно и на льготных условиях
  kaz: Азаматтардың жекелеген санаттарына амбулаториялық емдеу кезінде тегін және жеңілдікті шарттармен дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы
