act_code: '159192'
requisite: Решение маслихата города Нур-Султана от 29 сентября 2021 года № 84/12-VII. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 октября 2021 года № 24626
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, зарегистрированным в городе Нур-Султан за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Нұр-Сұлтан қаласында тіркелген Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
