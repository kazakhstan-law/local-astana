act_code: '157750'
requisite: Решение маслихата города Нур-Султана от 16 июля 2021 года № 66/9-VI. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 августа 2021 года № 23923. Утратило силу решением маслихата города Астаны от 29 марта 2024 года № 163/20-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированным в городе Астане при амбулаторном лечении бесплатно
  kaz: Астана қаласында тіркелген Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы
